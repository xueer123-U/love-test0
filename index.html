<style>

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;

    color:var(--ink);

  }
  .wrap{max-width:480px;margin:0 auto;min-height:100%;padding:0 20px;}
  .view{display:none;min-height:100vh;flex-direction:column;}
  .view.active{display:flex;}

  /* ===== 首页 ===== */
  #home{padding:48px 0 32px;justify-content:center;}
  .home-badge{
    align-self:center;font-size:13px;color:var(--pink);background:var(--pink-soft);
    padding:6px 14px;border-radius:999px;letter-spacing:.05em;margin-bottom:22px;
  }
  .home-title{font-size:30px;font-weight:800;line-height:1.35;text-align:center;letter-spacing:.02em;}
  .home-title em{font-style:normal;color:var(--pink);}
  .home-sub{margin-top:14px;text-align:center;color:var(--sub);font-size:15px;}
  .tags{margin-top:28px;display:flex;flex-direction:column;gap:12px;}
  .tag{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);
  }
  .tag .check{
    width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--pink-soft);
    display:flex;align-items:center;justify-content:center;
  }
  .tag .check svg{width:13px;height:13px;}
  .tag .t-main{font-weight:700;font-size:15px;}
  .tag .t-sub{color:var(--sub);font-size:13px;}
  .cta{
    margin-top:32px;width:100%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--pink),var(--coral));color:#fff;
    font-size:17px;font-weight:700;letter-spacing:.05em;padding:17px;border-radius:999px;
    box-shadow:0 12px 24px rgba(242,112,138,.32);
  }
  .home-note{margin-top:18px;text-align:center;font-size:12px;color:var(--sub);}

  /* ===== 答题页 ===== */
  #quiz{padding:28px 0 32px;}
  .progress-row{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .progress-num{font-size:14px;color:var(--pink);font-weight:700;white-space:nowrap;}
  .progress-bar{flex:1;height:8px;background:var(--pink-soft);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--coral));border-radius:999px;transition:width .3s;}
  .q-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 20px;box-shadow:var(--shadow);}
  .q-index{font-size:13px;color:var(--sub);margin-bottom:10px;}
  .q-title{font-size:19px;font-weight:800;line-height:1.5;margin-bottom:22px;}
  .options{display:flex;flex-direction:column;gap:13px;}
  .opt{
    border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:15px 16px;
    font-size:15px;color:var(--ink);text-align:left;cursor:pointer;line-height:1.55;
    transition:border-color .15s,background .15s;
  }
  .opt:active{background:var(--pink-soft);border-color:var(--pink);}
  .opt .letter{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--pink-soft);color:var(--pink);font-weight:700;font-size:13px;align-items:center;justify-content:center;margin-right:9px;vertical-align:1px;}

  /* ===== 结果页 ===== */
  #result{padding:36px 0 32px;justify-content:center;}
  .res-card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:30px 22px;box-shadow:var(--shadow);text-align:center;}
  .res-kicker{font-size:13px;color:var(--sub);letter-spacing:.08em;margin-bottom:12px;}
  .res-emoji{font-size:40px;margin-bottom:6px;}
  .res-name{font-size:24px;font-weight:800;color:var(--pink);margin-bottom:8px;}
  .res-slogan{font-size:15px;color:var(--coral);font-weight:700;margin-bottom:20px;}
  .res-desc{font-size:15px;color:var(--ink);text-align:left;background:var(--bg);border-radius:16px;padding:18px;line-height:1.75;}
  .res-tagline{margin-top:18px;font-size:12px;color:var(--sub);}
  .again{margin-top:24px;width:100%;border:1.5px solid var(--pink);background:#fff;color:var(--pink);font-size:16px;font-weight:700;padding:15px;border-radius:999px;cursor:pointer;}
</style>

var current = 0;
var scores = {};
var LETTERS = ["A","B","C","D"];

function show(id){
  document.querySelectorAll(".view").forEach(function(v){v.classList.remove("active");});
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

function startQuiz(){
  current = 0;
  scores = {};
  show("quiz");
  render();
}

function render(){
  var item = QUESTIONS[current];
  document.getElementById("progressNum").textContent = (current+1) + " / " + QUESTIONS.length;
  document.getElementById("progressFill").style.width = ((current)/QUESTIONS.length*100) + "%";
  document.getElementById("qIndex").textContent = "第 " + (current+1) + " 题";
  document.getElementById("qTitle").textContent = item.q;
  var box = document.getElementById("options");
  box.innerHTML = "";
  item.o.forEach(function(opt,i){
    var btn = document.createElement("button");
    btn.className = "opt";
    btn.innerHTML = '<span class="letter">'+LETTERS[i]+'</span>'+opt.t;
    btn.onclick = function(){ choose(opt.tag); };
    box.appendChild(btn);
  });
}

function choose(tag){
  scores[tag] = (scores[tag]||0) + 1;
  current++;
  if(current >= QUESTIONS.length){
    finish();
  } else {
    render();
  }
}

function finish(){
  var best = 1, bestScore = -1;
  // 按结果编号顺序遍历，平票时先出现的结果优先
  Object.keys(RESULTS).forEach(function(k){
    var s = scores[k]||0;
    if(s > bestScore){ bestScore = s; best = +k; }
  });
  var r = RESULTS[best];
  document.getElementById("resEmoji").textContent = r.emoji;
  document.getElementById("resName").textContent = r.name;
  document.getElementById("resSlogan").textContent = r.slogan;
  document.getElementById("resDesc").textContent = r.desc;
  show("result");
}

function restart(){ show("home"); }
</script>
